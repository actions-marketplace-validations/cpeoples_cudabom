name: diag-secret

# TEMPORARY diagnostic. Prints only a short sha256 fingerprint of the
# HOMEBREW_TAP_TOKEN secret (never the token itself) plus a live auth probe
# against the tap repo, so we can tell whether the runner receives the same
# token value that works locally. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint secret as the runner sees it
        env:
          HB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HB:-}" ]; then
            echo "SECRET IS EMPTY on the runner"
            exit 1
          fi
          printf 'length: %s\n' "${#HB}"
          printf 'sha256 (first 12): %s\n' "$(printf '%s' "$HB" | sha256sum | cut -c1-12)"
          case "$HB" in
            github_pat_*) echo "prefix: github_pat_ (fine-grained)";;
            ghp_*)        echo "prefix: ghp_ (classic PAT)";;
            *)            echo "prefix: UNEXPECTED";;
          esac

      - name: Live auth probe against tap repo (mimics actions/checkout default-branch lookup)
        env:
          HB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $HB" -H "Accept: application/vnd.github+json" https://api.github.com/repos/cpeoples/homebrew-tap)
          echo "GET /repos/cpeoples/homebrew-tap (Bearer) -> HTTP $code"
          echo "default_branch: $(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('default_branch','(none)'))")"
          git -c protocol.version=2 ls-remote "https://x-access-token:${HB}@github.com/cpeoples/homebrew-tap.git" HEAD >/dev/null 2>&1 \
            && echo "git ls-remote: OK" || echo "git ls-remote: FAILED"
