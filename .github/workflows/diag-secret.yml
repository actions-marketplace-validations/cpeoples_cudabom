name: diag-secret

# TEMPORARY diagnostic. Fingerprints CARGO_REGISTRY_TOKEN as the runner sees it
# (never prints the token) and validates it against crates.io from inside the
# runner (no CDN block there), using the exact publish endpoint cargo uses.
# Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint CARGO_REGISTRY_TOKEN as the runner sees it
        env:
          CT: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CT:-}" ]; then echo "SECRET IS EMPTY"; exit 1; fi
          printf 'length: %s\n' "${#CT}"
          printf 'sha256 (first 12): %s\n' "$(printf '%s' "$CT" | sha256sum | cut -c1-12)"
          case "$CT" in
            cio*) echo "prefix: cio (modern)";;
            *)    echo "prefix: UNEXPECTED (not cio)";;
          esac

      - name: Validate token against crates.io (real publish endpoint)
        env:
          CT: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # cargo authenticates with: Authorization: <token> (no 'Bearer').
          # Empty body to PUT /crates/new: a VALID token -> 400 (bad body);
          # an INVALID-format token -> 401 "does not match the format".
          code=$(curl -s -o /tmp/pub.json -w '%{http_code}' -X PUT \
            -H "Authorization: $CT" -H "Content-Type: application/json" \
            --data-binary '' https://crates.io/api/v1/crates/new || true)
          echo "PUT /api/v1/crates/new -> HTTP $code"
          echo "body:"; head -c 400 /tmp/pub.json || true; echo
          # Also hit /me for completeness
          mecode=$(curl -s -o /tmp/me.json -w '%{http_code}' -H "Authorization: $CT" https://crates.io/api/v1/me || true)
          echo "GET /api/v1/me -> HTTP $mecode"
          echo "me body:"; head -c 400 /tmp/me.json || true; echo
